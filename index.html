<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Rickshaw Lagbe? – Request a ride</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#f3f3f3;--g2:#e2e2e2;--t:#6b6b6b;--ok:#05944f}
body{margin:0;font:16px/1.4 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;color:#000;background:#fff;overflow:hidden}
#map{position:fixed;inset:0}.leaflet-control-attribution{font-size:9px}
button{font:inherit;cursor:pointer}
.fab{position:fixed;z-index:900;top:max(14px,env(safe-area-inset-top));left:14px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 12px #0003;font-size:20px}
#sheet{position:fixed;z-index:900;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0002;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;animation:up .3s}
#sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--g2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media(min-width:800px){#sheet{left:20px;right:auto;top:20px;bottom:auto;width:400px;border-radius:14px;max-height:calc(100vh - 40px)}#sheet:before{display:none}.fab{left:auto;right:20px}}
h2{font-size:24px;margin:4px 0 12px;letter-spacing:-.3px}h3{margin:0 0 4px;font-size:18px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:10px;background:#000;color:#fff;font-weight:600;margin-top:12px}.btn.l{background:var(--g);color:#000}.btn.red{background:#fde8e8;color:#c00}.btn:disabled{opacity:.4}
.search{display:flex;align-items:center;gap:14px;background:var(--g);border-radius:10px;padding:16px;font-size:20px;font-weight:600;cursor:pointer}
.item{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}.item:last-child{border:0}
.ic{width:38px;height:38px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none;font-size:17px}
.sub{color:var(--t);font-size:14px}.sp{margin-left:auto}.b{font-weight:600}
.veh{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:2px solid transparent;cursor:pointer}.veh.on{border-color:#000;background:#fafafa}.veh .em{font-size:34px;width:52px;text-align:center}
.pill{display:flex;align-items:center;gap:8px;background:var(--g);padding:10px 14px;border-radius:20px;font-size:14px;font-weight:600;flex:1}
.pill select,.pill input{border:0;background:none;font:inherit;width:100%;outline:0}
.in{width:100%;border:0;background:var(--g);padding:16px;border-radius:10px;font:inherit;margin:6px 0;outline:0}
.in:focus{box-shadow:inset 0 0 0 2px #000}
.row{display:flex;gap:10px;align-items:center}
.act{flex:1;text-align:center;font-size:13px}.act button{width:54px;height:54px;border-radius:50%;border:0;background:var(--g);font-size:22px;margin-bottom:4px}
.bar{height:4px;background:var(--g2);border-radius:2px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#000;transition:width .5s}
.pulse{width:70px;height:70px;border-radius:50%;background:#000;margin:20px auto;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #0006}100%{box-shadow:0 0 0 40px #0000}}
.pin{background:#000;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;letter-spacing:3px}
.av{width:56px;height:56px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:28px}
.st span{font-size:40px;color:var(--g2);cursor:pointer}.st span.on{color:#000}
.chip{display:inline-block;padding:10px 16px;margin:4px 6px 0 0;background:var(--g);border-radius:20px;font-weight:600;font-size:14px;cursor:pointer}.chip.on{background:#000;color:#fff}
#dr{position:fixed;z-index:1100;top:0;bottom:0;left:0;width:82%;max-width:330px;background:#fff;transform:translateX(-105%);transition:.25s;padding:max(24px,env(safe-area-inset-top)) 0 20px;display:flex;flex-direction:column}
#dr.o{transform:none}#bk{position:fixed;z-index:1050;inset:0;background:#0006;display:none}#bk.o{display:block}
#dr .u{padding:0 22px 20px;border-bottom:1px solid #eee;display:flex;gap:14px;align-items:center}
#dr a{padding:16px 22px;font-size:18px;font-weight:500;cursor:pointer}
#pg{position:fixed;z-index:1200;inset:0;background:#fff;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 18px 24px;display:none}#pg.o{display:block}
#land{position:fixed;z-index:2000;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}
#land .logo{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}#land .in{background:#1c1c1c;color:#fff}#land .btn{background:#fff;color:#000}
.hero{flex:1;display:grid;place-items:center;font-size:120px;animation:fl 3s infinite alternate}@keyframes fl{to{transform:translateY(-10px)}}
#ts{position:fixed;z-index:3000;left:50%;bottom:110px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;display:none;max-width:90%;text-align:center}
.mk{width:16px;height:16px;background:#000;border:3px solid #fff;box-shadow:0 0 0 1px #0004,0 2px 6px #0005}
</style>
</head>
<body>
<div id="map"></div>
<button class="fab" onclick="menu(1)" aria-label="Menu">☰</button>
<div id="sheet"></div>
<div id="bk" onclick="menu(0)"></div>
<div id="dr"></div>
<div id="pg"></div>
<div id="land"></div>
<div id="ts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const PL={"Dhanmondi 27":[23.7461,90.3742],"Gulshan 1":[23.7806,90.4166],"Uttara Sector 7":[23.8759,90.3795],"Mirpur 10":[23.8069,90.3687],"Farmgate":[23.7561,90.3897],"Motijheel":[23.7330,90.4172],"Banani":[23.7937,90.4066],"Mohakhali":[23.7776,90.3980],"Shahbag":[23.7389,90.3957],"New Market":[23.7340,90.3850],"Bashundhara R/A":[23.8190,90.4526],"Jatrabari":[23.7100,90.4350],"Airport":[23.8513,90.4084],"Kamalapur Station":[23.7312,90.4262]};
const TY={rickshaw:{n:"Rickshaw",bn:"রিকশা",e:"🚲",b:20,k:15,v:9,s:2},van:{n:"Battery Rickshaw",bn:"ব্যাটারি রিকশা",e:"🛵",b:25,k:18,v:14,s:3},auto:{n:"CNG Auto",bn:"অটো",e:"🛺",b:40,k:28,v:22,s:3},eauto:{n:"Easy Bike",bn:"ইজি বাইক",e:"⚡",b:30,k:20,v:16,s:4},bike:{n:"Moto",bn:"বাইক",e:"🏍️",b:30,k:22,v:25,s:1}};
const PR={FIRST50:[.5,60],RIDE20:[.2,40],BORSHA:[0,30]};
const DR=["Rahim Uddin","Karim Mia","Jamal Hossain","Sohel Rana","Abul Kashem"];
const S=JSON.parse(localStorage.getItem("rl")||"null")||{user:null,hist:[],saved:{Home:"Dhanmondi 27",Work:"Motijheel"},wallet:200};
const save=()=>localStorage.setItem("rl",JSON.stringify(S));
let T={pick:"Dhanmondi 27",drop:null,type:"rickshaw",pay:"Cash",promo:null,surge:false,tip:0},tm,mk={},line;
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView(PL[T.pick],14);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap © CARTO",maxZoom:19}).addTo(map);
const toast=m=>{const t=$("#ts");t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",2600)};
const sh=h=>{const s=$("#sheet");s.style.animation="none";s.offsetHeight;s.style.animation="";s.innerHTML=h;s.scrollTop=0};
const em=e=>L.divIcon({html:`<div style="font-size:30px;filter:drop-shadow(0 2px 3px #0005)">${e}</div>`,className:"",iconSize:[30,30]});
const dot=(sq)=>L.divIcon({html:`<div class="mk" style="${sq?"":"border-radius:50%"}"></div>`,className:"",iconSize:[16,16]});
function pin(k){mk[k]&&map.removeLayer(mk[k]);if(T[k])mk[k]=L.marker(PL[T[k]],{icon:dot(k==="drop")}).addTo(map)}
function route(){line&&map.removeLayer(line);if(T.pick&&T.drop){line=L.polyline([PL[T.pick],PL[T.drop]],{color:"#000",weight:4}).addTo(map);map.fitBounds(line.getBounds(),{paddingTopLeft:[40,60],paddingBottomRight:[40,innerWidth<800?420:60]})}}
const km=(a,b)=>map.distance(PL[a],PL[b])/1000*1.35;
const dist=()=>km(T.pick,T.drop);
const fare=t=>{const y=TY[t];let f=Math.max(y.b+y.k*dist(),y.b+20);if(T.surge)f*=1.2;return Math.round(f)};
const disc=f=>{const p=PR[T.promo];return p?Math.round(Math.min(p[0]?f*p[0]:p[1],p[1])):0};
const net=()=>fare(T.type)-disc(fare(T.type));
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"};
/* nav */
function menu(o){$("#dr").classList.toggle("o",o);$("#bk").classList.toggle("o",o);if(o)$("#dr").innerHTML=`<div class="u"><div class="av">🙂</div><div><div class="b" style="font-size:20px">${S.user?.name||""}</div><div class="sub">+880 ${S.user?.phone||""}</div></div></div><a onclick="page('act')">🕘 Activity</a><a onclick="page('wal')">👛 Wallet · ৳${S.wallet}</a><a onclick="page('promo')">🎁 Promotions</a><a onclick="page('drv')">🧑‍✈️ Drive &amp; earn</a><a onclick="page('help')">🛟 Safety &amp; help</a><a style="margin-top:auto;color:#c00" onclick="out()">Sign out</a>`}
function page(p){menu(0);const b=`<button class="fab" style="position:static;box-shadow:none;background:var(--g);margin-bottom:12px" onclick="$('#pg').classList.remove('o')">←</button>`;let h="";
if(p==="act")h=`<h2>Activity</h2>`+(S.hist.length?S.hist.map(r=>`<div class="item" style="cursor:default"><div class="ic">${TY[r.t].e}</div><div><div class="b">${r.to}</div><div class="sub">${r.d} · ${r.st}</div><div class="sub">from ${r.from} · ${r.pay}</div></div><div class="sp b">৳${r.f}</div></div>`).join(""):`<p class="sub">No trips yet. Your rides will show up here.</p>`);
if(p==="wal")h=`<h2>Wallet</h2><div style="background:#000;color:#fff;border-radius:14px;padding:22px"><div class="sub" style="color:#aaa">Balance</div><div style="font-size:40px;font-weight:700">৳${S.wallet}</div></div><button class="btn" onclick="S.wallet+=100;save();page('wal');toast('৳100 added via bKash (demo)')">+ Add ৳100 via bKash</button><button class="btn l" onclick="S.wallet+=500;save();page('wal');toast('৳500 added (demo)')">+ Add ৳500</button>`;
if(p==="promo")h=`<h2>Promotions</h2>`+Object.entries({FIRST50:"50% off your first ride (max ৳60)",RIDE20:"20% off any ride (max ৳40)",BORSHA:"৳30 off rainy-day rides"}).map(([k,v])=>`<div class="item" style="cursor:default"><div class="ic">🏷️</div><div><div class="b">${k}</div><div class="sub">${v}</div></div></div>`).join("")+`<p class="sub">Refer a friend with code <b>RL-${(S.user.phone||"").slice(-4)}</b></p>`;
if(p==="drv")h=`<h2>Drive &amp; earn</h2><div class="item" style="cursor:default"><div class="ic">💰</div><div>Keep 90% of every fare</div></div><div class="item" style="cursor:default"><div class="ic">🕒</div><div>Drive whenever you want</div></div><div class="item" style="cursor:default"><div class="ic">🛺</div><div>Rickshaw, battery rickshaw, CNG, easy bike</div></div><button class="btn" onclick="toast('Driver sign-up coming soon')">Sign up to drive</button>`;
if(p==="help")h=`<h2>Safety &amp; help</h2><div class="item" style="cursor:default"><div class="ic">🚨</div><div><div class="b">Emergency</div><div class="sub">Call 999 anytime</div></div></div><div class="item" style="cursor:default"><div class="ic">🔗</div><div><div class="b">Share trip status</div><div class="sub">From the trip screen</div></div></div><div class="item" style="cursor:default"><div class="ic">🔢</div><div><div class="b">PIN verification</div><div class="sub">Share your 4-digit PIN only after boarding</div></div></div>`;
$("#pg").innerHTML=b+h;$("#pg").classList.add("o")}
function out(){S.user=null;save();menu(0);land()}
/* login */
function land(){$("#land").style.display="flex";$("#land").innerHTML=`<div class="hero">🛺</div><div class="logo">Rickshaw<br>Lagbe?</div><p style="color:#aaa;margin:10px 0 18px">Rickshaw, CNG &amp; easy bike rides at your fingertips.</p><div class="row"><div class="in" style="width:auto;margin:0">🇧🇩 +880</div><input class="in" id="ph" type="tel" inputmode="numeric" placeholder="1XXXXXXXXX" style="margin:0"></div><button class="btn" onclick="ph1()">Continue</button>`}
function ph1(){let p=$("#ph").value.replace(/\D/g,"").replace(/^880/,"").replace(/^0/,"");if(!/^1\d{9}$/.test(p))return toast("Enter a valid Bangladesh mobile number");T.tmp=p;$("#land").innerHTML=`<div class="hero">💬</div><div class="logo" style="font-size:32px">Enter the 4-digit code</div><p style="color:#aaa">Sent to +880 ${p} · demo code: <b>1234</b></p><input class="in" id="ot" inputmode="numeric" maxlength="4" placeholder="••••" style="font-size:28px;letter-spacing:12px;text-align:center" oninput="if(this.value.length==4)ph2()"><button class="btn" onclick="ph2()">Verify</button>`;$("#ot").focus()}
function ph2(){if($("#ot").value!=="1234")return toast("Wrong code. Use 1234 (demo)");$("#land").innerHTML=`<div class="hero">👋</div><div class="logo" style="font-size:32px">What's your name?</div><input class="in" id="nm" placeholder="First name" style="margin-top:18px"><button class="btn" onclick="ph3()">Get started</button>`}
function ph3(){const n=$("#nm").value.trim();if(!n)return toast("Please enter your name");S.user={name:n,phone:T.tmp};save();enter()}
function enter(){$("#land").style.display="none";home()}
/* flow */
function home(){clearInterval(tm);T.drop=null;pin("drop");line&&map.removeLayer(line);mk.d&&map.removeLayer(mk.d);pin("pick");map.setView(PL[T.pick],14);
sh(`<div class="sub">${greet()}, ${S.user.name}</div><div class="search" onclick="where()"><span>🔍</span>Where to?</div>${Object.entries(S.saved).map(([k,v])=>`<div class="item" onclick="setDrop('${v}')"><div class="ic">${k=="Home"?"🏠":"💼"}</div><div><div class="b">${k}</div><div class="sub">${v}</div></div></div>`).join("")}<div class="item" onclick="where()"><div class="ic">🕘</div><div><div class="b">${S.hist[0]?S.hist[0].to:"Popular places"}</div><div class="sub">${S.hist[0]?"Recent trip":"Browse nearby"}</div></div></div>`)}
function where(){sh(`<div class="row"><button class="ic" style="border:0" onclick="home()">←</button><h3>Where to?</h3></div><input class="in" id="q" placeholder="Search destination" oninput="fl()" autofocus><div id="ls"></div>`);fl();setTimeout(()=>$("#q")?.focus(),50)}
function fl(){const q=$("#q").value.toLowerCase();$("#ls").innerHTML=Object.keys(PL).filter(n=>n!==T.pick&&n.toLowerCase().includes(q)).map(n=>`<div class="item" onclick="setDrop('${n}')"><div class="ic">📍</div><div><div class="b">${n}</div><div class="sub">${km(T.pick,n).toFixed(1)} km · Dhaka</div></div></div>`).join("")||`<p class="sub">No places found</p>`}
function setDrop(n){if(n===T.pick)return toast("Pickup and drop-off are the same");T.drop=n;pin("drop");route();ride()}
function ride(){const d=dist();sh(`<div class="row"><button class="ic" style="border:0" onclick="home()">←</button><div><h3>Choose a ride</h3><div class="sub">${T.pick} → ${T.drop} · ${d.toFixed(1)} km</div></div></div>`+Object.entries(TY).map(([k,y])=>{const f=fare(k),m=Math.max(2,Math.round(d/y.v*60)),D=disc(f);return`<div class="veh ${k==T.type?"on":""}" onclick="T.type='${k}';ride()"><div class="em">${y.e}</div><div><div class="b">${y.n} <span class="sub">· 👤${y.s}</span></div><div class="sub">${new Date(Date.now()+m*6e4+(k.length%4+2)*6e4).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} · ${k.length%4+2} min away</div></div><div class="sp" style="text-align:right"><div class="b">৳${f-D}</div>${D?`<div class="sub" style="text-decoration:line-through">৳${f}</div>`:""}</div></div>`}).join("")+`<div class="row" style="margin-top:10px"><label class="pill">💳<select onchange="T.pay=this.value">${["Cash","bKash","Nagad","Wallet"].map(p=>`<option ${p==T.pay?"selected":""}>${p}</option>`).join("")}</select></label><label class="pill">🏷️<input placeholder="Promo code" value="${T.promo||""}" onchange="promo(this.value)" style="text-transform:uppercase"></label></div><label class="sub" style="display:flex;gap:8px;margin-top:12px;align-items:center"><input type="checkbox" ${T.surge?"checked":""} onchange="T.surge=this.checked;ride()"> Rain / peak hour (+20%)</label><button class="btn" onclick="req()">Choose ${TY[T.type].n} · ৳${net()}</button>`)}
function promo(c){c=c.trim().toUpperCase();if(!c){T.promo=null}else if(PR[c]){T.promo=c;toast("Promo applied 🎉")}else{T.promo=null;toast("Invalid promo code")}ride()}
function req(){if(T.pay==="Wallet"&&S.wallet<net())return toast("Not enough wallet balance");let i=0;
sh(`<h2 style="text-align:center">Finding your ${TY[T.type].n}…</h2><div class="pulse"></div><p class="sub" style="text-align:center">Contacting nearby drivers</p><button class="btn l" onclick="home()">Cancel</button>`);tm=setTimeout(()=>trip(),3500)}
function trip(){const pn=1000+Math.floor(Math.random()*9000),dv={n:DR[Math.random()*5|0],r:(4.5+Math.random()*.5).toFixed(2),pl:"DHAKA-"+(10+Math.random()*89|0)+"-"+(1000+Math.random()*8999|0)};
const A=PL[T.pick],B=PL[T.drop],s0=[A[0]+.012,A[1]-.012],N=44;let s=0;mk.d&&map.removeLayer(mk.d);mk.d=L.marker(s0,{icon:em(TY[T.type].e)}).addTo(map);map.fitBounds(L.latLngBounds([s0,A,B]),{paddingTopLeft:[40,60],paddingBottomRight:[40,innerWidth<800?400:60]});
const v=()=>{const ph=s<16?0:s<N?1:2;sh(`<div class="row"><h3>${["Driver is on the way","On trip to "+T.drop,"You've arrived"][ph]}</h3><span class="pin sp">${pn}</span></div><div class="bar"><i style="width:${s/N*100}%"></i></div><div class="sub">${ph==0?"Arriving in "+Math.max(1,Math.ceil((16-s)/4))+" min · share PIN with driver":ph==1?"ETA "+Math.max(1,Math.ceil((N-s)/4))+" min":""}</div><div class="item" style="cursor:default"><div class="av">🧔</div><div><div class="b">${dv.n}</div><div class="sub">⭐ ${dv.r} · ${TY[T.type].n}</div></div><div class="sp b" style="text-align:right;font-size:14px;border:1px solid #ddd;border-radius:6px;padding:4px 8px">${dv.pl}</div></div><div class="row"><div class="act"><button onclick="toast('Calling ${dv.n}… (demo)')">📞</button>Call</div><div class="act"><button onclick="toast('Chat opened (demo)')">💬</button>Message</div><div class="act"><button onclick="toast('Trip link copied')">🔗</button>Share</div><div class="act"><button onclick="toast('Emergency alert sent (demo)')">🚨</button>SOS</div></div>${ph==0?`<button class="btn red" onclick="home()">Cancel trip</button>`:""}`)};
v();tm=setInterval(()=>{s++;const f=s<16?[s0,A,s/16]:s<N?[A,B,(s-16)/(N-16)]:[B,B,1];mk.d.setLatLng([f[0][0]+(f[1][0]-f[0][0])*f[2],f[0][1]+(f[1][1]-f[0][1])*f[2]]);v();if(s>=N){clearInterval(tm);setTimeout(()=>fin(dv),1500)}},700)}
function fin(dv){const f=net();if(T.pay==="Wallet")S.wallet-=f;S.hist.unshift({from:T.pick,to:T.drop,t:T.type,f,pay:T.pay,d:new Date().toLocaleString([],{dateStyle:"medium",timeStyle:"short"}),st:"Completed"});save();T.pick=T.drop;T.tip=0;
sh(`<h2 style="text-align:center">৳${f}</h2><p class="sub" style="text-align:center;margin-top:-8px">Paid with ${T.pay} · ${T.drop}</p><h3 style="text-align:center;margin-top:18px">Rate ${dv.n}</h3><div class="st" style="text-align:center">${[1,2,3,4,5].map(i=>`<span onclick="document.querySelectorAll('.st span').forEach((e,j)=>e.classList.toggle('on',j<${i}))">★</span>`).join("")}</div><div style="text-align:center">${[0,10,20,50].map(t=>`<span class="chip ${t?"":"on"}" onclick="T.tip=${t};document.querySelectorAll('.tp').forEach(e=>e.classList.remove('on'));this.classList.add('on')" ><span class="tp ${t?"":"on"}">${t?"+৳"+t:"No tip"}</span></span>`).join("")}</div><button class="btn" onclick="toast('Thanks for riding!');home()">Done</button>`);document.querySelectorAll(".chip").forEach(c=>c.onclick=function(){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));this.classList.add("on");T.tip=parseInt(this.textContent.replace(/\D/g,""))||0})}
S.user?enter():land();
</script>
</body>
</html>
